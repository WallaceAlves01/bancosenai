<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <title>Gestão de Documentos - Banco Senai</title>
    <link rel="stylesheet" href="documento.css"/>
</head>


<body>
    <h1>Gestão de Documentos</h1>
    <div class="form-container">
        <input type="number" id="codigoCliente" placeholder="Código do Cliente" />
        <input type="file" id="arquivo" />
        <button class="enviar" id="btEnvinar" onclick="enviarDocumento()">Enviar</button>
    </div>

    <div class="divBuscar">
        <input type="number" id="buscarCliente" />
        <button class="buscar" id="btBusEnvinar" onclick=" buscarDocumento()">Buscar Cliente</button>
    </div>

    <table class="tabela" id="tabelaDocumentos">
        <thead>
            <tr class="dentTabela">
                <th>ID</th>
                <th>Nome</th>
                <th>Arquivo</th>
                <th>Extensões</th>
            </tr>
        </thead>

        <tbody id="corpoTabela">
            <!-- Dados carregados via JS -->
        </tbody>
    </table>

    <script src="documento.js"></script>
</body>

</html>
